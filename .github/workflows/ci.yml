name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily check for a new Claude Code release
    - cron: "17 5 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Latest Claude Code version
        id: version
        run: |
          version=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "Unexpected version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The scheduled run only builds when that version is not published yet
          if [[ "${{ github.event_name }}" == schedule ]] \
              && docker manifest inspect "${IMAGE,,}:$version" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Claude Code $version already published"
          fi
      - uses: docker/setup-qemu-action@v4
        if: steps.version.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.version.outputs.skip != 'true'
      - uses: docker/metadata-action@v6
        if: steps.version.outputs.skip != 'true'
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/login-action@v4
        if: steps.version.outputs.skip != 'true' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.version.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: CLAUDE_VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
